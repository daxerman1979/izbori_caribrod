<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrovgrad - Izborna Mapa Uživo</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #e5e5e5; }
        
        #map { width: 100%; height: 100vh; background: #e5e5e5; }
        
        .custom-transparent-icon { background: transparent !important; border: none !important; width: 0 !important; height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
        
        /* -- STILOVI ZA DETALJNE TABLE (ZUMIRANO) -- */
        .map-board { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); border-radius: 8px; padding: 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 100px; max-width: 220px; border: 1px solid rgba(52, 152, 219, 0.3); }
        .live-turnout { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; font-size: 13px; font-weight: bold; padding: 4px 12px; border-radius: 12px; margin-bottom: 2px; box-shadow: 0 2px 8px rgba(243, 156, 18, 0.5); white-space: nowrap; }
        .board-title { font-size: 11px; font-weight: 800; color: #1e293b; text-align: center; line-height: 1.2; text-transform: uppercase; }
        .board-number { font-size: 10px; color: #ef4444; font-weight: 700; background: #fee2e2; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; margin-top: 2px;}

        @media (max-width: 600px) {
            .map-board { padding: 6px 10px; max-width: 160px; }
            .live-turnout { font-size: 11px; padding: 3px 8px; }
            .board-title { font-size: 10px; }
        }

        /* -- STILOVI ZA TAČKE (ODZUMIRANO) -- */
        .single-dot { 
            position: absolute; top: 0; left: 0; width: 14px; height: 14px; background: #e74c3c; 
            border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); 
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.8); cursor: pointer; transition: transform 0.2s;
        }
        .single-dot:hover { transform: translate(-50%, -50%) scale(1.3); }

        .cluster-dot { 
            position: absolute; top: 0; left: 0; width: 28px; height: 28px; background: #e74c3c; 
            border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); 
            display: flex; justify-content: center; align-items: center; color: white; 
            font-weight: bold; font-size: 13px; box-shadow: 0 0 15px rgba(231, 76, 60, 0.9); 
            cursor: pointer; animation: pulseCluster 2s infinite;
        }
        @keyframes pulseCluster {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        /* -- AUTOMATSKI TV KAJRON (DONJI PANEL) -- */
        #kajron-container {
            position: fixed;
            bottom: -200px;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 3px solid #e74c3c;
            z-index: 4000;
            transition: bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        
        #kajron-container.visible { bottom: 0; }

        .kajron-header {
            background: #e74c3c; color: white; font-size: 11px; font-weight: 900;
            padding: 4px 15px; letter-spacing: 2px; text-transform: uppercase;
            display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
            border-bottom-right-radius: 10px;
        }
        
        .live-dot-small { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: pulseWhite 1.5s infinite; }
        @keyframes pulseWhite { 0% { box-shadow: 0 0 0 0 rgba(255,255,255, 0.7); } 70% { box-shadow: 0 0 0 5px rgba(255,255,255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255, 0); } }

        /* Omotač koji skriva viškove */
        .kajron-track {
            width: 100%;
            overflow: hidden;
            padding: 15px 0;
        }

        /* Sama traka koja putuje */
        .ticker-content {
            display: flex;
            gap: 12px;
            width: max-content;
            animation: scrollTicker 45s linear infinite; /* Podešavanje brzine (45s) */
            padding-left: 12px;
        }

        /* Pauza kada se pređe mišem ili prstom! */
        .ticker-content:hover, .ticker-content:active {
            animation-play-state: paused;
        }

        /* Animacija pomeranja - Ide tačno za -50% širine kako bi dupliran sadržaj stvorio beskonačnu petlju */
        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .kajron-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            padding: 12px 15px; min-width: 220px; max-width: 220px; display: flex; flex-direction: column; gap: 6px;
        }
        
        .kc-title { font-size: 12px; font-weight: 800; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
        .kc-broj { color: #e74c3c; font-weight: 900; margin-right: 5px;}
        .kc-data { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .kc-perc { font-size: 22px; font-weight: 900; color: #f39c12; line-height: 1; }
        .kc-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; }
        .kc-stats { display: flex; justify-content: space-between; font-size: 10px; color: #a0aec0; margin-top: 2px; }
        .kc-stats strong { color: white; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- TV KAJRON -->
    <div id="kajron-container">
        <div class="kajron-header">
            <div class="live-dot-small"></div> IZVEŠTAJI SA BIRAČKIH MESTA (UŽIVO)
        </div>
        <div class="kajron-track">
            <!-- Traka koja putuje (sadržaj se u JS-u ubacuje 2 puta za beskonačan loop) -->
            <div class="ticker-content" id="ticker-content">
                <!-- Kartice se generišu ovde -->
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        // Kreiranje mape
        var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([43.0186, 22.7447], 12);
        L.control.zoom({ position: 'topleft' }).addTo(map);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // ZATAMNJIVANJE TERITORIJE (Ostrvo Dimitrovgrad)
        fetch('https://nominatim.openstreetmap.org/search?q=Op%C5%A1tina+Dimitrovgrad,+Serbia&format=json&polygon_geojson=1&limit=1')
            .then(response => response.json())
            .then(data => {
                if(data.length > 0 && data[0].geojson) {
                    var geojsonCoords = data[0].geojson.coordinates;
                    var latlngs = [];
                    if(data[0].geojson.type === "Polygon") {
                        latlngs.push(geojsonCoords[0].map(coord => [coord[1], coord[0]]));
                    } else if (data[0].geojson.type === "MultiPolygon") {
                        geojsonCoords.forEach(poly => { latlngs.push(poly[0].map(coord => [coord[1], coord[0]])); });
                    }
                    var worldBounds = [[-90, -180], [90, -180], [90, 180], [-90, 180]];
                    var maskLayers = [worldBounds];
                    latlngs.forEach(hole => maskLayers.push(hole));
                    L.polygon(maskLayers, { color: '#2980b9', weight: 3, fillOpacity: 1, fillColor: '#e5e5e5' }).addTo(map);
                }
            });

        var aktivniMarkeri = {};
        var globalnaMestaData = null;

        function renderMapAndKajron() {
            if (!globalnaMestaData) return;

            let currentZoom = map.getZoom();
            let isZoomedOut = currentZoom < 15;
            let isMobile = window.innerWidth <= 600;

            // Prikaz/skrivanje kajrona
            let kajronContainer = document.getElementById('kajron-container');
            if (isZoomedOut) { kajronContainer.classList.add('visible'); } 
            else { kajronContainer.classList.remove('visible'); }

            // KREIRANJE BESKONAČNOG KAJRONA
            let tickerContent = document.getElementById('ticker-content');
            let sortiranaMestaKeys = Object.keys(globalnaMestaData).sort((a,b) => parseInt(globalnaMestaData[a].broj) - parseInt(globalnaMestaData[b].broj));
            
            let kajronHtml = '';
            sortiranaMestaKeys.forEach(id => {
                let m = globalnaMestaData[id];
                let u = m.ukupan_broj || 0; 
                let i = m.izaslo || 0;
                let procenat = u > 0 ? ((i / u) * 100).toFixed(1) : 0;
                let vremeTxt = m.vreme_update ? m.vreme_update + 'h' : '--:--';

                kajronHtml += `
                    <div class="kajron-card">
                        <div class="kc-title"><span class="kc-broj">${m.broj}.</span> ${m.naziv}</div>
                        <div class="kc-data">
                            <div>
                                <div class="kc-label">Izlaznost</div>
                                <div class="kc-perc">${procenat}%</div>
                            </div>
                        </div>
                        <div class="kc-stats">
                            <span>Glasalo: <strong>${i} / ${u}</strong></span>
                            <span>Presek: <strong>${vremeTxt}</strong></span>
                        </div>
                    </div>
                `;
            });
            // Dupliciramo html string da bi kreirali beskonačnu petlju prilikom animacije
            tickerContent.innerHTML = kajronHtml + kajronHtml;


            // CRTANJE MAPA MARКERA
            for (let id in aktivniMarkeri) map.removeLayer(aktivniMarkeri[id]);
            aktivniMarkeri = {};

            let grupe = [];
            const DISTANCE_THRESHOLD = 0.002; 
            Object.keys(globalnaMestaData).forEach(id => {
                let m = globalnaMestaData[id];
                let dodato = false;
                for (let g of grupe) {
                    let dx = g.lat - m.lat;
                    let dy = g.lng - m.lng;
                    if (Math.sqrt(dx*dx + dy*dy) < DISTANCE_THRESHOLD) {
                        g.mesta.push({...m, id: id});
                        dodato = true;
                        break;
                    }
                }
                if (!dodato) { grupe.push({ lat: m.lat, lng: m.lng, mesta: [{...m, id: id}] }); }
            });

            grupe.forEach((g, indexGroup) => {
                let count = g.mesta.length;

                if (isZoomedOut) {
                    let clusterHtml = count > 1 ? `<div class="cluster-dot" title="Biračkih mesta: ${count}">${count}</div>` : `<div class="single-dot" title="${g.mesta[0].naziv}"></div>`;
                    var pinIcon = L.divIcon({ className: 'custom-transparent-icon', html: clusterHtml, iconSize: [0, 0], iconAnchor: [0, 0] });
                    var marker = L.marker([g.lat, g.lng], { icon: pinIcon }).addTo(map);
                    
                    marker.on('click', () => { map.setView([g.lat, g.lng], 16, { animate: true }); });
                    aktivniMarkeri['group_' + indexGroup] = marker;

                } else {
                    g.mesta.forEach((mesto, index) => {
                        let angle, distance;
                        let baseDistance = isMobile ? 50 : 80;

                        if (count === 1) { angle = -Math.PI / 2; distance = isMobile ? 40 : 60; } 
                        else if (count === 2) { angle = (index === 0) ? -Math.PI/4 : -3*Math.PI/4; distance = baseDistance + 10; } 
                        else { angle = (index / count) * 2 * Math.PI - (Math.PI / 2); distance = baseDistance + (count * 10); }

                        let offsetX = Math.cos(angle) * distance;
                        let offsetY = Math.sin(angle) * distance;

                        let izlaznostHtml = '';
                        if(mesto.ukupan_broj && mesto.izaslo) {
                            let procenat = ((mesto.izaslo / mesto.ukupan_broj) * 100).toFixed(1);
                            let vremeTxt = mesto.vreme_update ? ` do ${mesto.vreme_update}h` : '';
                            izlaznostHtml = `<div class="live-turnout">👥 ${procenat}% ${vremeTxt}</div>`;
                        }

                        let pinHtml = `
                            <div style="position: relative; width: 0; height: 0; overflow: visible;">
                                <svg style="position: absolute; top: -300px; left: -300px; width: 600px; height: 600px; z-index: 998; pointer-events: none;">
                                    <line x1="300" y1="300" x2="${300 + offsetX}" y2="${300 + offsetY}" stroke="#3498db" stroke-width="2.5" stroke-dasharray="5,5"/>
                                    <circle cx="${300 + offsetX}" cy="${300 + offsetY}" r="3" fill="#3498db" />
                                </svg>
                                <div style="position: absolute; top: 0; left: 0; width: 12px; height: 12px; background: #e74c3c; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 999; box-shadow: 0 0 10px rgba(231, 76, 60, 0.8);"></div>
                                <div class="map-board" style="position: absolute; top: ${offsetY}px; left: ${offsetX}px; transform: translate(-50%, -50%); z-index: 1000; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.25));">
                                    ${izlaznostHtml}
                                    <span class="board-title">${mesto.naziv}</span>
                                    <span class="board-number">BR: ${mesto.broj}</span>
                                </div>
                            </div>
                        `;

                        var markerIcon = L.divIcon({ className: 'custom-transparent-icon', html: pinHtml, iconSize: [0, 0], iconAnchor: [0, 0] });
                        var marker = L.marker([mesto.lat, mesto.lng], { icon: markerIcon }).addTo(map);
                        aktivniMarkeri[mesto.id] = marker;
                    });
                }
            });
        }

        onValue(mestaRef, (snapshot) => {
            globalnaMestaData = snapshot.val();
            renderMapAndKajron();
        });

        map.on('zoomend', renderMapAndKajron);
        window.addEventListener('resize', renderMapAndKajron);

    </script>
</body>
</html>
