<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caribrodski izbori</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; background: #e5e5e5; }
        #map { width: 100%; height: 100vh; }
        
        .custom-transparent-icon { background: transparent !important; border: none !important; width: 0 !important; height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
        .map-pin-container { position: absolute; top: 0; left: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.25)); z-index: 1000; cursor: pointer; }
        .map-pin-container:hover .map-board { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }

        .map-board { background: #ffffff; border-radius: 8px; padding: 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 90px; max-width: 220px; transition: all 0.2s ease; position: relative; }
        .live-turnout { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 12px; margin-bottom: 4px; box-shadow: 0 2px 8px rgba(243, 156, 18, 0.5); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        
        .board-title { font-size: 13px; font-weight: 800; color: #1e293b; text-align: center; line-height: 1.2; text-transform: uppercase; }
        .board-number { font-size: 11px; color: #ef4444; font-weight: 700; background: #fee2e2; padding: 2px 10px; border-radius: 12px; text-transform: uppercase; }
        .map-triangle { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid #ffffff; margin-top: -1px; }

        .leaflet-popup-tip-container { display: none !important; }
        .leaflet-popup { margin-bottom: 25px !important; }
        .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.95) !important; backdrop-filter: blur(12px); color: white !important; border-radius: 14px !important; box-shadow: 0 15px 35px rgba(0,0,0,0.5) !important; border: 1px solid rgba(255, 255, 255, 0.1); padding: 5px !important; }
        .leaflet-popup-close-button { color: #ffffff !important; font-size: 18px !important; top: 6px !important; right: 10px !important; font-weight: bold !important; transition: color 0.2s; }
        .leaflet-popup-close-button:hover { color: #ff4757 !important; }

        .profi-form { display: flex; flex-direction: column; gap: 10px; width: 260px; padding: 8px; }
        .profi-form h4 { margin: 0 0 5px 0; font-size: 15px; font-weight: 600; color: #ffffff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; text-align: center; text-transform: uppercase; }

        .board-section { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .profi-input { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; padding: 8px 10px; color: white; font-size: 13px; outline: none; width: 100%; box-sizing: border-box; }
        .profi-input:focus { border-color: #3498db; background: rgba(255, 255, 255, 0.12); }
        select.profi-input option { background-color: #0f172a; color: white; font-weight: bold; }
        .profi-form label { font-size: 11px; color: #a0aec0; margin-bottom: -6px; font-weight: 600; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.5px;}

        .rezultati-lista { max-height: 220px; overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 8px; }
        .rezultati-lista::-webkit-scrollbar { width: 4px; }
        .rezultati-lista::-webkit-scrollbar-thumb { background: #3498db; border-radius: 4px; }
        .rezultat-red { display: flex; flex-direction: column; gap: 4px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
        .rezultat-red label { white-space: normal; word-wrap: break-word; color: #ecf0f1; font-size: 11px; margin-bottom: 2px; }

        .profi-submit-btn { background: linear-gradient(135deg, #2ed573, #26af5f); color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); transition: opacity 0.2s, transform 0.1s; text-transform: uppercase; }
        .profi-submit-btn:hover { opacity: 0.9; }
        .btn-nazad { background: #7f8c8d; }
        .btn-izlaznost { background: linear-gradient(135deg, #f39c12, #d35400); }
        .btn-rezultati { background: linear-gradient(135deg, #3498db, #2980b9); }
        .btn-row { display: flex; gap: 8px; } .btn-row > button { flex: 1; }

        #admin-badge { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: #e74c3c; color: white; padding: 6px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; z-index: 1000; display: none; box-shadow: 0 4px 10px rgba(231,76,60,0.4); }

        /* Admin Desni Meni */
        #admin-sidebar { position: fixed; right: -320px; top: 0; width: 300px; height: 100vh; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px); border-left: 1px solid rgba(255,255,255,0.1); box-shadow: -5px 0 30px rgba(0,0,0,0.5); z-index: 3000; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; color: white; }
        #admin-sidebar.open { right: 0; }
        .admin-sidebar-header { padding: 20px; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .admin-sidebar-header h3 { margin: 0; font-size: 16px; color: #3498db; text-transform: uppercase; }
        .admin-sidebar-header p { margin: 5px 0 0 0; font-size: 11px; color: #a0aec0; }
        .admin-sidebar-content { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
        
        .drag-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 12px; cursor: grab; display: flex; flex-direction: column; gap: 4px; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .drag-item:hover { background: rgba(52, 152, 219, 0.15); border-color: #3498db; transform: translateX(-3px); }
        .drag-item:active { cursor: grabbing; opacity: 0.8; transform: scale(0.98); }
        .drag-item-broj { font-size: 11px; color: #f39c12; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .drag-item-naziv { font-size: 14px; font-weight: bold; color: white; text-transform: uppercase; }

        /* --- STATISTIKA PANEL --- */
        #stat-panel { position: fixed; bottom: -85vh; left: 0; width: 100%; height: 80vh; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -10px 40px rgba(0,0,0,0.6); z-index: 2000; transition: bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; color: white; }
        #stat-panel.otvoren { bottom: 0; }
        
        .stat-header { display: flex; padding: 15px 20px; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.08); border-top-left-radius: 20px; border-top-right-radius: 20px; align-items: center; justify-content: space-between; }
        .stat-tabs { display: flex; gap: 10px; }
        .stat-tab { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #a0aec0; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .stat-tab:hover { background: rgba(255,255,255,0.1); color: white; }
        .stat-tab.active-tab { background: #3498db; color: white; border-color: #3498db; box-shadow: 0 0 15px rgba(52, 152, 219, 0.4); }
        
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .export-btn { background: #27ae60; color: white; border: 1px solid #2ecc71; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
        .export-btn:hover { background: #2ecc71; transform: scale(1.05); }
        .close-stat { background: transparent; border: none; color: white; font-size: 28px; cursor: pointer; line-height: 1; transition: transform 0.2s; }
        .close-stat:hover { transform: scale(1.2); color: #ff4757; }
        
        .opstina-naslov { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 12px; font-weight: 800; color: #ecf0f1; letter-spacing: 1.5px; margin: 15px 0 10px 0; text-transform: uppercase; }
        .live-dot { width: 10px; height: 10px; background: #ff4757; border-radius: 50%; animation: pulseRed 1.5s infinite; }
        @keyframes pulseRed { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }

        .summary-dashboard { display: flex; gap: 12px; padding: 0 20px 15px 20px; }
        .summary-card { flex: 1; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
        .summary-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: rgba(255,255,255,0.1); }
        .summary-card h3 { margin: 0; font-size: 24px; color: #ffffff; font-weight: 800; }
        .summary-card p { margin: 4px 0 0 0; font-size: 10px; color: #a0aec0; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; line-height: 1.2; }
        
        .card-accent-orange { background: rgba(243, 156, 18, 0.05); border-color: rgba(243, 156, 18, 0.2); }
        .card-accent-orange::before { background: #f39c12; }
        .text-orange { color: #f39c12 !important; font-size: 32px !important; }
        
        .card-accent-blue { background: rgba(52, 152, 219, 0.05); border-color: rgba(52, 152, 219, 0.2); }
        .card-accent-blue::before { background: #3498db; }
        .text-blue { color: #3498db !important; font-size: 32px !important; }

        /* NOVO: Poboljšan kontejner za tabove (Drag to scroll) */
        .sub-tabs-container { 
            display: flex; gap: 8px; overflow-x: auto; padding: 5px 20px 15px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            scroll-behavior: smooth; 
            -webkit-overflow-scrolling: touch; /* Zbog glatkog telefonskog skrolanja */
            cursor: grab; /* Pokazivač za miša */
            user-select: none; /* Da ne selektuje tekst dok se vuče */
        }
        .sub-tabs-container:active { cursor: grabbing; } /* Kada se klikne i vuče */
        .sub-tabs-container::-webkit-scrollbar { height: 4px; }
        .sub-tabs-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        .sub-tab { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #a0aec0; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; white-space: nowrap; transition: all 0.3s; text-transform: uppercase; }
        .sub-tab:hover { background: rgba(255,255,255,0.1); color: white; }
        
        .theme-orange .sub-tab.active { background: #f39c12; color: white; border-color: #f39c12; box-shadow: 0 0 10px rgba(243, 156, 18, 0.4); }
        .theme-blue .sub-tab.active { background: #3498db; color: white; border-color: #3498db; box-shadow: 0 0 10px rgba(52, 152, 219, 0.4); }

        .stat-details-area { padding: 15px 20px; overflow-y: auto; flex: 1; scroll-behavior: smooth; }
        
        @keyframes slideUpFade { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes fillProgress { 0% { width: 0%; } 100% { width: var(--target-width); } }

        .stat-row { background: rgba(255,255,255,0.02); border-radius: 10px; padding: 12px 15px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); opacity: 0; animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; position: relative; overflow: hidden; }
        .stat-row:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
        .stat-row-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; font-size: 13px; line-height: 1.3; position: relative; z-index: 2; text-transform: uppercase; }
        
        .progress-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.3); border-radius: 5px; overflow: hidden; margin-top: 5px; position: relative; z-index: 2; }
        .progress-fill { height: 100%; width: var(--target-width); animation: fillProgress 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .bg-orange { background: linear-gradient(90deg, #f39c12, #e67e22); }
        .bg-blue { background: linear-gradient(90deg, #3498db, #2980b9); }
        
        .stat-time { font-size: 11px; color: #a0aec0; margin-top: 8px; display: flex; justify-content: space-between; position: relative; z-index: 2; text-transform: uppercase; }
        .empty-state { text-align: center; color: #a0aec0; padding: 30px; font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;}

        #btn-otvori-stat { position: absolute; bottom: 20px; right: 20px; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; border: none; padding: 14px 22px; border-radius: 30px; font-weight: bold; z-index: 1000; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.2s; display: flex; align-items: center; gap: 8px; font-size: 14px; text-transform: uppercase;}
        #btn-otvori-stat:hover { transform: scale(1.05); }
        .btn-live-dot { width: 10px; height: 10px; background: #fff; border-radius: 50%; animation: pulseRed 1.5s infinite; }
    </style>
</head>
<body>

    <div id="admin-badge">ADMIN REŽIM AKTIVAN</div>
    
    <div id="admin-sidebar">
        <div class="admin-sidebar-header">
            <h3>Biračka Mesta</h3>
            <p>Prevucite karticu na tačnu lokaciju na mapi da je postavite.</p>
        </div>
        <div class="admin-sidebar-content" id="drag-items-container">
            <!-- Puni se automatski -->
        </div>
    </div>

    <div id="map"></div>
    
    <button id="btn-otvori-stat" onclick="toggleStatPanel(true)">
        <div class="btn-live-dot"></div> UŽIVO ANALITIKA
    </button>

    <div id="stat-panel">
        <div class="stat-header">
            <div class="stat-tabs">
                <button class="stat-tab active-tab" onclick="prikaziGlavniTab('izlaznost')" id="main-tab-izlaznost">Izlaznost</button>
                <button class="stat-tab" onclick="prikaziGlavniTab('rezultati')" id="main-tab-rezultati">Rezultati izbora</button>
            </div>
            
            <div class="header-actions">
                <button class="export-btn" onclick="exportujUExcel()">📥 Export u Excel</button>
                <button class="close-stat" onclick="toggleStatPanel(false)">&times;</button>
            </div>
        </div>
        
        <div id="stat-content-area" class="theme-orange" style="display:flex; flex-direction:column; flex:1; overflow:hidden;">
            <!-- Generiše se iz JS -->
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'da';

        const spisakMestaDragDrop = [
            { broj: "01", naziv: "NARODNA BIBLIOTEKA – DIMITROVGRAD, UL. SUTJESKA BR. 2" },
            { broj: "02", naziv: "STACIONAR – DIMITROVGRAD, UL. SUTJESKA BB" },
            { broj: "03", naziv: "GIMNAZIJA „SV. KIRILA I METODIJA\" – DIMITROVGRAD, UL. ĆIRILA I METODIJA BR. 12" },
            { broj: "04", naziv: "DEČJI VRTIĆ – DIMITROVGRAD, UL. SVETOSAVSKA BR. 2" },
            { broj: "05", naziv: "UPRAVA JP „KOMUNALAC\" – DIMITROVGRAD, UL. IVO ANDRIĆ 49" },
            { broj: "06", naziv: "OSNOVNA ŠKOLA – DIMITROVGRAD, UL. HRISTO BOTEV BR. 3" },
            { broj: "07", naziv: "CENTAR ZA KULTURU – DIMITROVGRAD, TRG DR ZORANA ĐINĐIĆA BR. 2" },
            { broj: "08", naziv: "DEČIJI VRTIĆ – DIMITROVGRAD, UL. BOŠKO BUHA BB" },
            { broj: "09", naziv: "ZGRADA ŠPEDICIJE NA ŽELEZNIČKOJ STANICI – DIMITROVGRAD, UL. BALKANSKA BR. 124" },
            { broj: "10", naziv: "DOM KULTURE – SELO LUKAVICA, UL. LUKAVAČKA BR. 31" },
            { broj: "11", naziv: "DOM KULTURE – NASELJE BELEŠ, UL. BELEŠ BB" },
            { broj: "12", naziv: "DOM KULTURE – SELO ŽELJUŠA, UL. GEORGI DIMITROVA BR. 139" },
            { broj: "13", naziv: "OSNOVNA ŠKOLA – SELO ŽELJUŠA, UL. STOČAR (OBJEKAT BR. 3)" },
            { broj: "14", naziv: "DOM KULTURE.. – SELO GOJIN DOL, UL. BORISA IVANOVA BR. 72" },
            { broj: "15", naziv: "OSNOVNA ŠKOLA – SELO GRADINJE, UL. BAČEVSКА BR. 37" },
            { broj: "16", naziv: "ZADRUŽNI DOM – SELO KUSA VRANA, UL. SELO BR. 62" },
            { broj: "17", naziv: "DOM KULTURE – SELO TRNSKI ODOROVCI, UL. TRNSKI ODOROVCI BR. 148" },
            { broj: "18", naziv: "ZADRUŽNI DOM – SELO DONJA NEVLJA, UL. DONJA NEVLJA BR. 109" },
            { broj: "19", naziv: "DOM KULTURE – SELO POGANOVO, UL. POGANOVO BR. 64" },
            { broj: "20", naziv: "DOM KULTURE – SELO VISOČKI ODOROVCI, UL. VISOČKI ODOROVCI BR. 166" },
            { broj: "21", naziv: "DOM KULTURE – SELO SMILOVCI, UL. SMILOVCI BR. 21A" },
            { broj: "22", naziv: "DOM KULTURE – SELO PROTOPOPINCI, UL. PROTOPOPINCI BR. 42" },
            { broj: "23", naziv: "AMBULANTA DOMA ZDRAVLJA DIMITROVGRAD – SELO IZATOVCI, UL. BABINA NJIVA BR. 56" }
        ];

        if (isAdmin) {
            document.getElementById('admin-badge').style.display = 'block';
            document.getElementById('admin-sidebar').classList.add('open');
            
            let dragContainer = document.getElementById('drag-items-container');
            spisakMestaDragDrop.forEach(mesto => {
                let div = document.createElement('div');
                div.className = 'drag-item';
                div.draggable = true;
                div.innerHTML = `<span class="drag-item-broj">Biračko mesto br. ${mesto.broj}</span><span class="drag-item-naziv">${mesto.naziv}</span>`;
                
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('naziv', mesto.naziv);
                    e.dataTransfer.setData('broj', mesto.broj);
                });
                dragContainer.appendChild(div);
            });
        }

        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 14);
        L.control.zoom({ position: 'topleft' }).addTo(map);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        var aktivniMarkeri = {};
        window.globalnaMestaData = {}; 

        window.politickeListe = [
            "Aleksandar Vučić - Ujedinjena Srbija", "Ivica Dačić - Faktor stabilnosti", "Studentska lista - Studenti pobeđuju",
            "Radim Ljajić - Ljudski", "Savez vojvođanskih Mađara - Dr Balint Pastor", "Usame Zukorlić - Pokret za ujedinjenje",
            "Ruska stranka - Srbija u Briksu - Slobodan Nikolić", "Autentična desnica - Dr Miloš Jovanović", "Evropska Srbija - Marinika Tepić - Zdravko Ponoš",
            "SDA Sanžaka - Čuvari Sandžaka", "Bogoljub Karić - Pokret snaga Srbije", "Liberalno zelena stranka - Za slobodnu i čistiju Srbiju",
            "Biram pravu - Biram budućnost - Koalicija snaga...", "Stranka rusko-srpskog jedinstva - Rusi i Srbi braća zauvek",
            "Ćale ovo je za tebe - Petar Đurić", "Vladimir Gajić - Alternativa za Srbiju", "Albanska koalicija", "Majka Srbija - Gruda"
        ];

        window.getSatiOptions = function() { let opts = ''; for(let i=0; i<24; i++) { let v = i.toString().padStart(2,'0'); opts += `<option value="${v}">${v}</option>`; } return opts; }
        window.getMinutiOptions = function() { let opts = ''; for(let i=0; i<60; i+=5) { let v = i.toString().padStart(2,'0'); opts += `<option value="${v}">${v}</option>`; } return opts; }

        onValue(mestaRef, (snapshot) => {
            for (let id in aktivniMarkeri) map.removeLayer(aktivniMarkeri[id]);
            aktivniMarkeri = {};
            const data = snapshot.val();
            if (!data) return;

            window.globalnaMestaData = data; 
            azurirajStatistiku(); 

            Object.keys(data).forEach((id) => {
                let mesto = data[id];
                
                let izlaznostHtml = '';
                if(mesto.ukupan_broj && mesto.izaslo) {
                    let procenat = ((mesto.izaslo / mesto.ukupan_broj) * 100).toFixed(1);
                    let vremeTxt = mesto.vreme_update ? ` do ${mesto.vreme_update}h` : '';
                    izlaznostHtml = `<div class="live-turnout">👥 ${procenat}% ${vremeTxt}</div>`;
                }

                var pinHtml = `
                    <div class="map-pin-container">
                        <div class="map-board">
                            ${izlaznostHtml}
                            <span class="board-title">${mesto.naziv}</span>
                            <span class="board-number">BR: ${mesto.broj}</span>
                        </div>
                        <div class="map-triangle"></div>
                    </div>`;

                var pinIcon = L.divIcon({ className: 'custom-transparent-icon', html: pinHtml, iconSize: [0, 0], iconAnchor: [0, 0] });
                var marker = L.marker([mesto.lat, mesto.lng], { icon: pinIcon }).addTo(map);
                
                marker.on('click', function(e) {
                    L.DomEvent.stopPropagation(e); 
                    let popupContent = `
                        <div class="profi-form" id="popup-content-${id}">
                            <h4>Zaštićen pristup</h4>
                            <input type="password" id="pin-input-${id}" class="profi-input" placeholder="UNESITE KOD..." maxlength="15" oninput="this.value = this.value.toUpperCase()">
                            <button class="profi-submit-btn" onclick="proveriPin('${id}')">OTKLJUČAJ TABLU</button>
                        </div>`;
                    
                    L.popup({ closeOnClick: false }).setLatLng(marker.getLatLng()).setContent(popupContent).openOn(map);
                });
                aktivniMarkeri[id] = marker;
            });
        });

        window.proveriPin = function(id) {
            let uneseniPin = document.getElementById(`pin-input-${id}`).value.trim().toUpperCase();
            let mesto = window.globalnaMestaData[id];
            let tacanPin = mesto.pin ? mesto.pin.toUpperCase() : '123456';
            
            if (uneseniPin === tacanPin) { 
                prikaziGlavniMeni(id); 
            } else { 
                alert("Netačan kod za ovo biračko mesto!"); 
            }
        };

        window.prikaziGlavniMeni = function(id) {
            let mesto = window.globalnaMestaData[id];
            let sadrzaj = `
                <div class="profi-form">
                    <h4>KONTROLNA TABLA</h4>
                    <div class="board-section">
                        <label>UPISANI BIRAČI PO SPISKU</label>
                        <input type="number" id="ukupan-broj-${id}" class="profi-input" value="${mesto.ukupan_broj || ''}">
                        <button class="profi-submit-btn" style="padding: 6px; margin-top: 2px;" onclick="sacuvajUkupanBroj('${id}')">SAČUVAJ</button>
                    </div>
                    <div class="btn-row" style="margin-top: 5px;">
                        <button class="profi-submit-btn btn-izlaznost" onclick="prikaziIzlaznost('${id}')">IZLAZNOST</button>
                        <button class="profi-submit-btn btn-rezultati" onclick="prikaziRezultate('${id}')">REZULTATI</button>
                    </div>
                </div>`;
            document.getElementById(`popup-content-${id}`).innerHTML = sadrzaj;
        };

        window.sacuvajUkupanBroj = function(id) {
            let b = document.getElementById(`ukupan-broj-${id}`).value;
            if(!b) return;
            update(ref(db, 'biracka_mesta/' + id), { ukupan_broj: parseInt(b) });
        };

        window.prikaziIzlaznost = function(id) {
            let mesto = window.globalnaMestaData[id];
            let sadrzaj = `
                <div class="profi-form">
                    <h4>UNOS IZLAZNOSTI</h4>
                    <div class="board-section">
                        <label>IZAŠLO BIRAČA:</label>
                        <input type="number" id="izaslo-${id}" class="profi-input" value="${mesto.izaslo || ''}">
                        <label style="margin-top:5px;">DO (VREME):</label>
                        <div class="btn-row">
                            <select id="vreme-sat-${id}" class="profi-input">${getSatiOptions()}</select>
                            <span style="color:white; align-self:center;">:</span>
                            <select id="vreme-minut-${id}" class="profi-input">${getMinutiOptions()}</select>
                        </div>
                    </div>
                    <div class="btn-row" style="margin-top: 5px;">
                        <button class="profi-submit-btn btn-nazad" onclick="prikaziGlavniMeni('${id}')">NAZAD</button>
                        <button class="profi-submit-btn" onclick="sacuvajIzlaznost('${id}')">SNIMI</button>
                    </div>
                </div>`;
            document.getElementById(`popup-content-${id}`).innerHTML = sadrzaj;
        };

        window.sacuvajIzlaznost = function(id) {
            let i = document.getElementById(`izaslo-${id}`).value;
            let s = document.getElementById(`vreme-sat-${id}`).value;
            let m = document.getElementById(`vreme-minut-${id}`).value;
            if(!i) return;
            update(ref(db, 'biracka_mesta/' + id), { izaslo: parseInt(i), vreme_update: `${s}:${m}` }).then(() => {
                prikaziGlavniMeni(id); window.postaviPodTab(id); prikaziGlavniTab('izlaznost'); toggleStatPanel(true);
            });
        };

        window.prikaziRezultate = function(id) {
            let mesto = window.globalnaMestaData[id];
            let r = mesto.rezultati || {};
            let inps = window.politickeListe.map((ime, idx) => `
                <div class="rezultat-red">
                    <label>${idx + 1}. ${ime.toUpperCase()}</label>
                    <input type="number" id="rez-${id}-${idx}" class="profi-input" value="${r[idx] !== undefined ? r[idx] : ''}">
                </div>`).join('');
            let sadrzaj = `
                <div class="profi-form" style="width: 280px;">
                    <h4>UNOS REZULTATA</h4>
                    <div class="rezultati-lista">${inps}</div>
                    <div class="btn-row" style="margin-top: 8px;">
                        <button class="profi-submit-btn btn-nazad" onclick="prikaziGlavniMeni('${id}')">NAZAD</button>
                        <button class="profi-submit-btn" onclick="sacuvajRezultate('${id}')">SNIMI</button>
                    </div>
                </div>`;
            document.getElementById(`popup-content-${id}`).innerHTML = sadrzaj;
        };

        window.sacuvajRezultate = function(id) {
            let r = {};
            window.politickeListe.forEach((_, idx) => {
                let v = document.getElementById(`rez-${id}-${idx}`).value;
                if (v !== '') r[idx] = parseInt(v);
            });
            update(ref(db, 'biracka_mesta/' + id), { rezultati: r }).then(() => {
                prikaziGlavniMeni(id); window.postaviPodTab(id); prikaziGlavniTab('rezultati'); toggleStatPanel(true);
            });
        };

        if (isAdmin) {
            let mapContainer = document.getElementById('map');
            mapContainer.addEventListener('dragover', (e) => { e.preventDefault(); });
            mapContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                let prevuceniNaziv = e.dataTransfer.getData('naziv');
                let prevuceniBroj = e.dataTransfer.getData('broj');
                if (!prevuceniNaziv || !prevuceniBroj) return;

                var rect = mapContainer.getBoundingClientRect();
                var latlng = map.containerPointToLatLng([e.clientX - rect.left, e.clientY - rect.top]);
                prikaziAdminFormu(latlng.lat, latlng.lng, prevuceniNaziv, prevuceniBroj);
            });

            map.on('click', function(e) {
                prikaziAdminFormu(e.latlng.lat, e.latlng.lng, '', '');
            });
        }

        function prikaziAdminFormu(lat, lng, prefilledNaziv, prefilledBroj) {
            var formHtml = `
                <div class="profi-form">
                    <h4>PODEŠAVANJE LOKACIJE</h4>
                    <label>NAZIV MESTA</label>
                    <input type="text" id="input-naziv" class="profi-input" value="${prefilledNaziv}" placeholder="NAZIV" oninput="this.value = this.value.toUpperCase()">
                    <label>BROJ MESTA</label>
                    <input type="text" id="input-broj" class="profi-input" value="${prefilledBroj}" placeholder="BROJ" oninput="this.value = this.value.toUpperCase()">
                    <label>SIGURNOSNI PIN</label>
                    <input type="text" id="input-pin" class="profi-input" placeholder="ŠIFRA (PIN)" oninput="this.value = this.value.toUpperCase()">
                    <button id="save-btn" class="profi-submit-btn" style="margin-top: 5px;">POSTAVI NA MAPU</button>
                </div>`;
            L.popup({ closeOnClick: false }).setLatLng([lat, lng]).setContent(formHtml).openOn(map);
            
            setTimeout(() => {
                var btn = document.getElementById('save-btn');
                if(btn) btn.onclick = function() {
                    var n = document.getElementById('input-naziv').value.trim().toUpperCase();
                    var b = document.getElementById('input-broj').value.trim().toUpperCase();
                    var p = document.getElementById('input-pin').value.trim().toUpperCase();
                    
                    if(!n || !b || !p) return alert("Popunite sva 3 polja (uključujući šifru)!");
                    push(mestaRef, { lat: lat, lng: lng, naziv: n, broj: b, pin: p }).then(() => map.closePopup());
                };
            }, 100);
        }

        // --- STATISTIKA I EKSPORT ---
        let trenutniGlavniTab = 'izlaznost';
        let trenutniPodTab = 'sve';

        window.toggleStatPanel = function(otvori) {
            let p = document.getElementById('stat-panel');
            if(otvori) p.classList.add('otvoren'); else p.classList.remove('otvoren');
            if(otvori) azurirajStatistiku();
        }

        window.prikaziGlavniTab = function(tab) {
            trenutniGlavniTab = tab;
            document.getElementById('main-tab-izlaznost').classList.remove('active-tab');
            document.getElementById('main-tab-rezultati').classList.remove('active-tab');
            document.getElementById(`main-tab-${tab}`).classList.add('active-tab');
            
            let area = document.getElementById('stat-content-area');
            area.className = tab === 'izlaznost' ? 'theme-orange' : 'theme-blue';
            azurirajStatistiku();
        }

        window.postaviPodTab = function(id) {
            trenutniPodTab = id;
            
            // Logika da se prilikom klika vizuelno pomeri na taj tab
            let slider = document.querySelector('.sub-tabs-container');
            if (slider) {
                let aktivniTab = Array.from(slider.children).find(t => t.innerText.includes(id === 'sve' ? 'SVA BIRAČKA' : window.globalnaMestaData[id].broj));
                if (aktivniTab) {
                    slider.scrollTo({
                        left: aktivniTab.offsetLeft - (slider.offsetWidth / 2) + (aktivniTab.offsetWidth / 2),
                        behavior: 'smooth'
                    });
                }
            }
            azurirajStatistiku();
        }

        window.exportujUExcel = function() {
            if(!window.globalnaMestaData || Object.keys(window.globalnaMestaData).length === 0) return alert("Nema podataka za eksport!");
            
            let table = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body><table border="1">`;
            table += `<tr><th>Biračko mesto</th><th>Upisani birači</th><th>Izašlo birača</th><th>Izlaznost (%)</th><th>Važeći glasovi</th>`;
            window.politickeListe.forEach(l => { table += `<th>${l.toUpperCase()}</th>`; });
            table += `</tr>`;
            
            let sortiranaMestaKeys = Object.keys(window.globalnaMestaData).sort((a,b) => parseInt(window.globalnaMestaData[a].broj) - parseInt(window.globalnaMestaData[b].broj));
            let totUpisano = 0, totIzaslo = 0, totVazeci = 0;
            let totListe = new Array(window.politickeListe.length).fill(0);
            
            sortiranaMestaKeys.forEach(id => {
                let m = window.globalnaMestaData[id];
                let upisano = m.ukupan_broj || 0; let izaslo = m.izaslo || 0;
                let izlaznost = upisano > 0 ? ((izaslo/upisano)*100).toFixed(2) : 0;
                let vazeci = 0;
                let glasoviHtml = "";
                
                window.politickeListe.forEach((_, idx) => {
                    let g = (m.rezultati && m.rezultati[idx]) ? parseInt(m.rezultati[idx]) : 0;
                    vazeci += g; totListe[idx] += g;
                    glasoviHtml += `<td>${g}</td>`;
                });
                
                totUpisano += upisano; totIzaslo += izaslo; totVazeci += vazeci;
                table += `<tr><td>${m.broj}. ${m.naziv}</td><td>${upisano}</td><td>${izaslo}</td><td>${izlaznost}%</td><td>${vazeci}</td>${glasoviHtml}</tr>`;
            });
            
            let totIzlaznost = totUpisano > 0 ? ((totIzaslo/totUpisano)*100).toFixed(2) : 0;
            table += `<tr><th>UKUPNO CARIBROD</th><th>${totUpisano}</th><th>${totIzaslo}</th><th>${totIzlaznost}%</th><th>${totVazeci}</th>`;
            totListe.forEach(g => { table += `<th>${g}</th>`; });
            table += `</tr></table></body></html>`;
            
            let blob = new Blob([table], { type: 'application/vnd.ms-excel' });
            let url = URL.createObjectURL(blob);
            let link = document.createElement("a");
            link.href = url;
            link.download = "Caribrodski_Izbori_Rezultati.xls";
            link.click();
        };

        window.azurirajStatistiku = function() {
            let area = document.getElementById('stat-content-area');
            if(!window.globalnaMestaData || Object.keys(window.globalnaMestaData).length === 0) { 
                area.innerHTML = "<p class='empty-state'>NEMA UNETIH PODATAKA.</p>"; return; 
            }

            let sortiranaMestaKeys = Object.keys(window.globalnaMestaData).sort((a,b) => parseInt(window.globalnaMestaData[a].broj) - parseInt(window.globalnaMestaData[b].broj));

            let opstinaUpisano = 0; let opstinaIzaslo = 0;
            let opstinaVazeciGlasovi = 0;

            sortiranaMestaKeys.forEach(id => {
                let m = window.globalnaMestaData[id];
                if (m.ukupan_broj) opstinaUpisano += parseInt(m.ukupan_broj);
                if (m.izaslo) opstinaIzaslo += parseInt(m.izaslo);
                if (m.rezultati) {
                    Object.keys(m.rezultati).forEach(idx => {
                        opstinaVazeciGlasovi += parseInt(m.rezultati[idx]) || 0;
                    });
                }
            });

            let topHtml = `<div class="opstina-naslov"><div class="live-dot"></div> UŽIVO ZBIRNO (OPŠTINA CARIBROD)</div>`;
            
            if (trenutniGlavniTab === 'izlaznost') {
                let totalProc = opstinaUpisano > 0 ? ((opstinaIzaslo / opstinaUpisano) * 100).toFixed(1) : 0;
                topHtml += `
                    <div class="summary-dashboard">
                        <div class="summary-card"><h3>${opstinaUpisano}</h3><p>UPISANIH BIRAČA</p></div>
                        <div class="summary-card"><h3>${opstinaIzaslo}</h3><p>IZAŠLO NA GLASANJE</p></div>
                        <div class="summary-card card-accent-orange"><h3 class="text-orange">${totalProc}%</h3><p>UKUPNA IZLAZNOST</p></div>
                    </div>`;
            } else {
                topHtml += `
                    <div class="summary-dashboard">
                        <div class="summary-card card-accent-blue" style="padding: 20px;">
                            <h3 class="text-blue">${opstinaVazeciGlasovi}</h3><p style="font-size:12px;">UKUPNO VAŽEĆIH GLASOVA U OPŠTINI</p>
                        </div>
                    </div>`;
            }

            let subTabsHtml = `<div class="sub-tabs-container">
                <button class="sub-tab ${trenutniPodTab === 'sve' ? 'active' : ''}" onclick="postaviPodTab('sve')">SVA BIRAČKA MESTA</button>`;
            sortiranaMestaKeys.forEach(id => {
                let m = window.globalnaMestaData[id];
                subTabsHtml += `<button class="sub-tab ${trenutniPodTab === id ? 'active' : ''}" onclick="postaviPodTab('${id}')">${m.broj}. ${m.naziv}</button>`;
            });
            subTabsHtml += `</div>`;

            let detailsHtml = `<div class="stat-details-area">`;
            let mestaZaPrikaz = trenutniPodTab === 'sve' ? sortiranaMestaKeys : [trenutniPodTab];

            if (trenutniGlavniTab === 'izlaznost') {
                let redniBroj = 0;
                mestaZaPrikaz.forEach(id => {
                    let m = window.globalnaMestaData[id]; let u = m.ukupan_broj || 0; let i = m.izaslo || 0;
                    if(u > 0) {
                        let p = ((i / u) * 100).toFixed(1);
                        detailsHtml += `
                            <div class="stat-row" style="animation-delay: ${redniBroj * 0.05}s">
                                <div class="stat-row-header"><span>BR. ${m.broj} - ${m.naziv}</span> <span style="color:#f39c12;">${p}%</span></div>
                                <div class="progress-bg"><div class="progress-fill bg-orange" style="--target-width: ${p}%"></div></div>
                                <div class="stat-time"><span>IZAŠLO: <b style="color:white">${i}/${u}</b></span> <span>VREME UNOSA: ${m.vreme_update ? m.vreme_update+'h' : 'NEMA'}</span></div>
                            </div>`;
                        redniBroj++;
                    }
                });
                if(redniBroj === 0) detailsHtml += `<p class="empty-state">NEMA UNETIH PODATAKA O IZLAZNOSTI.</p>`;
            } else {
                let lokalniGlasovi = new Array(window.politickeListe.length).fill(0);
                let lokalniVazeci = 0;

                mestaZaPrikaz.forEach(id => {
                    let rez = window.globalnaMestaData[id].rezultati;
                    if (rez) {
                        Object.keys(rez).forEach(idx => {
                            let g = parseInt(rez[idx]) || 0;
                            lokalniGlasovi[idx] += g;
                            lokalniVazeci += g;
                        });
                    }
                });

                if (lokalniVazeci === 0) {
                    detailsHtml += `<p class="empty-state">NEMA UNETIH REZULTATA GLASANJA.</p>`;
                } else {
                    let stranke = window.politickeListe.map((ime, idx) => {
                        let g = lokalniGlasovi[idx];
                        let p = lokalniVazeci > 0 ? ((g / lokalniVazeci) * 100).toFixed(2) : 0;
                        return { ime, broj: idx + 1, glasovi: g, procenat: parseFloat(p) };
                    }).filter(s => s.glasovi > 0).sort((a,b) => b.glasovi - a.glasovi);

                    let naslovReza = trenutniPodTab === 'sve' ? "ZBIRNO GLASANJE - SVA MESTA" : `REZULTATI - ${window.globalnaMestaData[trenutniPodTab].naziv}`;
                    detailsHtml += `<p style="text-align:center; color:#a0aec0; font-size:12px; font-weight:bold; margin-top:0;">${naslovReza} (${lokalniVazeci} GLASOVA)</p>`;

                    let redniBroj = 0;
                    stranke.forEach(s => {
                        detailsHtml += `
                            <div class="stat-row" style="animation-delay: ${redniBroj * 0.05}s">
                                <div class="stat-row-header">
                                    <span style="flex:1; padding-right:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${s.ime.toUpperCase()}">${s.broj}. ${s.ime.toUpperCase()}</span> 
                                    <span style="color:#3498db; font-size:16px;">${s.procenat}%</span>
                                </div>
                                <div class="progress-bg"><div class="progress-fill bg-blue" style="--target-width: ${s.procenat}%"></div></div>
                                <div class="stat-time">OSVOJENIH GLASOVA: <b style="color:white; font-size:13px;">${s.glasovi}</b></div>
                            </div>`;
                        redniBroj++;
                    });
                }
            }
            detailsHtml += `</div>`;
            area.innerHTML = topHtml + subTabsHtml + detailsHtml;

            // NOVO: Ubacivanje logike za "Drag to scroll" horizontalnog menija
            let slider = area.querySelector('.sub-tabs-container');
            if (slider) {
                let isDown = false;
                let startX;
                let scrollLeft;

                // Mouse Eventi za prevlačenje na PC-u
                slider.addEventListener('mousedown', (e) => {
                    isDown = true;
                    startX = e.pageX - slider.offsetLeft;
                    scrollLeft = slider.scrollLeft;
                });
                slider.addEventListener('mouseleave', () => { isDown = false; });
                slider.addEventListener('mouseup', () => { isDown = false; });
                slider.addEventListener('mousemove', (e) => {
                    if (!isDown) return;
                    e.preventDefault();
                    const x = e.pageX - slider.offsetLeft;
                    const walk = (x - startX) * 1.5; // Brzina prevlačenja
                    slider.scrollLeft = scrollLeft - walk;
                });

                // Skrolovanje korišćenjem točkića na mišu (Hover + Wheel)
                slider.addEventListener('wheel', (e) => {
                    if(e.deltaY !== 0) {
                        e.preventDefault();
                        slider.scrollLeft += e.deltaY;
                    }
                });
            }
        }
    </script>
</body>
</html>
