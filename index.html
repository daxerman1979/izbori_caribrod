<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrovgrad - Biračka Mesta</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #e5e5e5;
        }

        .custom-transparent-icon {
            background: transparent !important;
            border: none !important;
        }

        .map-pin-container {
            position: absolute;
            bottom: 0;
            left: 0;
            transform: translate(-50%, -100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.25));
            z-index: 1000;
            cursor: pointer; /* Pokazuje da je tabla klikabilna */
        }

        /* Hover efekat kada se predje mišem preko table */
        .map-pin-container:hover .map-board {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .map-board {
            background: #ffffff;
            border-radius: 6px;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 80px;
            max-width: 220px;
            transition: all 0.2s ease;
        }

        .board-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .board-number {
            font-size: 11px;
            color: #ef4444;
            font-weight: 700;
            background: #fee2e2;
            padding: 2px 10px;
            border-radius: 12px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .map-triangle {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid #ffffff;
            margin-top: -1px;
        }

        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.85) !important;
            backdrop-filter: blur(12px);
            color: white !important;
            border-radius: 14px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px !important;
        }

        .leaflet-popup-tip {
            background: rgba(20, 20, 20, 0.85) !important;
        }

        .profi-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 210px;
            padding: 8px;
        }

        .profi-form h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        /* Dodatni stil za labele unutar panela za podatke */
        .profi-form label {
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: -6px;
            font-weight: 600;
        }

        .profi-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 9px 12px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .profi-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .profi-input:focus {
            border-color: #3498db;
            background: rgba(255, 255, 255, 0.12);
        }

        /* Stil za veće tekstualno polje (Rezultati) */
        textarea.profi-input {
            resize: vertical;
            min-height: 60px;
        }

        .profi-submit-btn {
            background: linear-gradient(135deg, #2ed573, #26af5f);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 5px;
        }

        .profi-submit-btn:hover {
            opacity: 0.9;
        }

        .profi-submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 14);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> saradnici'
        }).addTo(map);

        var aktivniMarkeri = {};

        onValue(mestaRef, (snapshot) => {
            for (let id in aktivniMarkeri) {
                map.removeLayer(aktivniMarkeri[id]);
            }
            aktivniMarkeri = {};

            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                let mesto = data[id];

                var pinHtml = `
                    <div class="map-pin-container">
                        <div class="map-board">
                            <span class="board-title">${mesto.naziv}</span>
                            <span class="board-number">Broj: ${mesto.broj}</span>
                        </div>
                        <div class="map-triangle"></div>
                    </div>
                `;

                var pinIcon = L.divIcon({
                    className: 'custom-transparent-icon',
                    html: pinHtml,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });

                var marker = L.marker([mesto.lat, mesto.lng], { icon: pinIcon }).addTo(map);
                
                // --- NOVO: Klik na postojeću tablu otvara zahtev za PIN ---
                marker.on('click', function(e) {
                    L.DomEvent.stopPropagation(e); // Sprečava da mapa registruje klik za novo mesto

                    // Prvobitni sadržaj: Traženje koda
                    let popupContent = `
                        <div class="profi-form" id="popup-content-${id}">
                            <h4>Zaštićen pristup</h4>
                            <input type="password" id="pin-input-${id}" class="profi-input" placeholder="Unesite kod..." maxlength="6">
                            <button class="profi-submit-btn" onclick="proveriPin('${id}')">Otključaj</button>
                        </div>
                    `;

                    L.popup()
                        .setLatLng(marker.getLatLng())
                        .setContent(popupContent)
                        .openOn(map);
                });

                aktivniMarkeri[id] = marker;
            });
        });

        // Globalna funkcija za proveru PIN-a
        window.proveriPin = function(id) {
            let uneseniPin = document.getElementById(`pin-input-${id}`).value;
            
            if (uneseniPin === '123456') {
                // Ako je PIN tačan, menjamo sadržaj u panel za unos podataka
                let noviSadrzaj = `
                    <h4>Unos Podataka</h4>
                    
                    <label>Izlaznost (%)</label>
                    <input type="text" id="izlaznost-${id}" class="profi-input" placeholder="Npr. 45.5%">
                    
                    <label>Rezultati</label>
                    <textarea id="rezultati-${id}" class="profi-input" placeholder="Unesite raspored glasova..."></textarea>
                    
                    <button class="profi-submit-btn" onclick="potvrdiPodatke('${id}')">Potvrdi</button>
                `;
                document.getElementById(`popup-content-${id}`).innerHTML = noviSadrzaj;
            } else {
                alert("Netačan kod! Pokušajte ponovo.");
            }
        };

        // Globalna funkcija za potvrdu (spremna za sledeći korak)
        window.potvrdiPodatke = function(id) {
            let izlaznost = document.getElementById(`izlaznost-${id}`).value;
            let rezultati = document.getElementById(`rezultati-${id}`).value;
            
            alert(`Spremno za snimanje!\nIzlaznost: ${izlaznost}\nRezultati: ${rezultati}\n\nOvo ćemo u sledećem koraku poslati u bazu!`);
            map.closePopup();
        };

        // Klik na praznu mapu i dalje dodaje nova biračka mesta
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            var formHtml = `
                <div class="profi-form">
                    <h4>Novo Biračko Mesto</h4>
                    <input type="text" id="input-naziv" class="profi-input" placeholder="Naziv (npr. Dom kulture)">
                    <input type="text" id="input-broj" class="profi-input" placeholder="Broj (npr. 05)">
                    <button id="save-btn" class="profi-submit-btn">Postavi tablu na mapu</button>
                </div>
            `;

            L.popup()
                .setLatLng([lat, lng])
                .setContent(formHtml)
                .openOn(map);

            setTimeout(() => {
                var saveBtn = document.getElementById('save-btn');
                if (saveBtn) {
                    saveBtn.onclick = function() {
                        var naziv = document.getElementById('input-naziv').value.trim();
                        var broj = document.getElementById('input-broj').value.trim();

                        if (!naziv || !broj) {
                            alert("Molimo popunite oba polja (naziv i broj)!");
                            return;
                        }

                        const novoMestoRef = push(mestaRef);
                        set(novoMestoRef, {
                            lat: lat,
                            lng: lng,
                            naziv: naziv,
                            broj: broj
                        }).then(() => {
                            map.closePopup();
                        }).catch((error) => {
                            alert("Greška pri upisu u bazu: " + error.message);
                        });
                    };
                }
            }, 100);
        });
    </script>

</body>
</html>
