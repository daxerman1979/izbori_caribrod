<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrovgrad - Biračka Mesta</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
        }

        /* Profesionalni, moderni GUI bedž direktno na mapi */
        .profi-badge {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 8px 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translate(-50%, -100%);
            position: relative;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .profi-badge:hover {
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
            transform: translate(-50%, -102%);
        }

        /* Donji streličasti kursor bedža */
        .profi-badge::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 7px 0;
            border-style: solid;
            border-color: rgba(255, 255, 255, 0.95) transparent;
            display: block;
            width: 0;
        }

        .badge-icon-box {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);
        }

        .badge-content {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .badge-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7f8c8d;
            font-weight: 600;
        }

        .badge-title {
            font-size: 13px;
            font-weight: 700;
            color: #2c3e50;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-profi-delete {
            background: #ff4757;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 4px;
            transition: background 0.2s, transform 0.2s;
        }

        .btn-profi-delete:hover {
            background: #ff6b81;
            transform: scale(1.1);
        }

        /* Profi staklasti prozor za unos (popup) */
        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.85) !important;
            backdrop-filter: blur(12px);
            color: white !important;
            border-radius: 14px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px !important;
        }

        .leaflet-popup-tip {
            background: rgba(20, 20, 20, 0.85) !important;
        }

        .profi-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 210px;
            padding: 8px;
        }

        .profi-form h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .profi-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 9px 12px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .profi-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .profi-input:focus {
            border-color: #3498db;
            background: rgba(255, 255, 255, 0.12);
        }

        .profi-submit-btn {
            background: linear-gradient(135deg, #2ed573, #26af5f);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        .profi-submit-btn:hover {
            opacity: 0.9;
        }

        .profi-submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        // Inicijalizacija mape centrirane na Dimitrovgrad
        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 14);

        // Pozicioniranje kontrola za zumiranje diskretno u desni ugao
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Korišćenje tamne ili standardne mape po izboru (Ovde je standardna OpenStreetMap svetla podloga sa prilagođenim bedževima)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> saradnici'
        }).addTo(map);

        var aktivniMarkeri = {};

        // Sinhronizacija u realnom vremenu sa Firebase bazom
        onValue(mestaRef, (snapshot) => {
            for (let id in aktivniMarkeri) {
                map.removeLayer(aktivniMarkeri[id]);
            }
            aktivniMarkeri = {};

            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                let mesto = data[id];

                // Konstruisanje profesionalnog HTML bedža
                var badgeHtml = `
                    <div class="profi-badge">
                        <div class="badge-icon-box">#${mesto.broj}</div>
                        <div class="badge-content">
                            <span class="badge-label">Biračko mesto</span>
                            <span class="badge-title" title="${mesto.naziv}">${mesto.naziv}</span>
                        </div>
                        <button class="btn-profi-delete" onclick="obrisiMesto('${id}', event)" title="Ukloni mesto">✕</button>
                    </div>
                `;

                var profiIcon = L.divIcon({
                    className: 'custom-profi-icon',
                    html: badgeHtml,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });

                var marker = L.marker([mesto.lat, mesto.lng], { icon: profiIcon }).addTo(map);
                aktivniMarkeri[id] = marker;
            });
        });

        // Klik na bilo koji deo mape otvara profi formu za unos
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            var formHtml = `
                <div class="profi-form">
                    <h4>Novo Biračko Mesto</h4>
                    <input type="text" id="input-broj" class="profi-input" placeholder="Broj (npr. 05)">
                    <input type="text" id="input-naziv" class="profi-input" placeholder="Naziv (npr. Osnovna škola)">
                    <button id="save-btn" class="profi-submit-btn">Sačuvaj na mapu</button>
                </div>
            `;

            L.popup()
                .setLatLng([lat, lng])
                .setContent(formHtml)
                .openOn(map);

            setTimeout(() => {
                var saveBtn = document.getElementById('save-btn');
                if (saveBtn) {
                    saveBtn.onclick = function() {
                        var broj = document.getElementById('input-broj').value.trim();
                        var naziv = document.getElementById('input-naziv').value.trim();

                        if (!broj || !naziv) {
                            alert("Molimo popunite oba polja (broj i naziv)!");
                            return;
                        }

                        const novoMestoRef = push(mestaRef);
                        set(novoMestoRef, {
                            lat: lat,
                            lng: lng,
                            broj: broj,
                            naziv: naziv
                        }).then(() => {
                            map.closePopup();
                        }).catch((error) => {
                            alert("Greška pri upisu u bazu: " + error.message);
                        });
                    };
                }
            }, 100);
        });

        // Funkcija za brisanje sačuvane lokacije
        window.obrisiMesto = function(id, event) {
            event.stopPropagation();
            if (confirm("Da li ste sigurni da želite da obrišete ovo biračko mesto?")) {
                remove(ref(db, 'biracka_mesta/' + id)).catch((error) => {
                    alert("Greška pri brisanju: " + error.message);
                });
            }
        };
    </script>

</body>
</html>
