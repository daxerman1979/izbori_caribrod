<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrovgrad - Izborna Mapa Uživo</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, sans-serif; overflow: hidden; background: #e5e5e5; }
        
        #map { width: 100%; height: 100vh; background: #e5e5e5; }
        
        .custom-transparent-icon { background: transparent !important; border: none !important; width: 0 !important; height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
        
        /* -- STILOVI ZA DETALJNE TABLE (ZUMIRANO) -- */
        .map-board { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(5px); border-radius: 8px; padding: 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 100px; max-width: 220px; border: 1px solid rgba(52, 152, 219, 0.3); }
        .live-turnout { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; font-size: 13px; font-weight: bold; padding: 4px 12px; border-radius: 12px; margin-bottom: 2px; box-shadow: 0 2px 8px rgba(243, 156, 18, 0.5); white-space: nowrap; }
        .board-title { font-size: 11px; font-weight: 800; color: #1e293b; text-align: center; line-height: 1.2; text-transform: uppercase; }
        .board-number { font-size: 10px; color: #ef4444; font-weight: 700; background: #fee2e2; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; margin-top: 2px;}

        /* Prilagođavanje za male ekrane telefona */
        @media (max-width: 600px) {
            .map-board { padding: 6px 10px; max-width: 160px; }
            .live-turnout { font-size: 11px; padding: 3px 8px; }
            .board-title { font-size: 10px; }
        }

        /* -- STILOVI ZA TAČKE/KLASTERE (ODZUMIRANO) -- */
        .single-dot { 
            position: absolute; top: 0; left: 0; width: 14px; height: 14px; background: #e74c3c; 
            border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); 
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.8); cursor: pointer; transition: transform 0.2s;
        }
        .single-dot:hover { transform: translate(-50%, -50%) scale(1.3); }

        .cluster-dot { 
            position: absolute; top: 0; left: 0; width: 28px; height: 28px; background: #e74c3c; 
            border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); 
            display: flex; justify-content: center; align-items: center; color: white; 
            font-weight: bold; font-size: 13px; box-shadow: 0 0 15px rgba(231, 76, 60, 0.9); 
            cursor: pointer; animation: pulseCluster 2s infinite;
        }
        @keyframes pulseCluster {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        // Kreiranje mape (Inicijalni zoom stavljen na 12 da se vidi cela opština kao tačke)
        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 12);
        L.control.zoom({ position: 'topleft' }).addTo(map);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // ZATAMNJIVANJE TERITORIJE VAN OPŠTINE
        fetch('https://nominatim.openstreetmap.org/search?q=Op%C5%A1tina+Dimitrovgrad,+Serbia&format=json&polygon_geojson=1&limit=1')
            .then(response => response.json())
            .then(data => {
                if(data.length > 0 && data[0].geojson) {
                    var geojsonCoords = data[0].geojson.coordinates;
                    var latlngs = [];
                    
                    if(data[0].geojson.type === "Polygon") {
                        latlngs.push(geojsonCoords[0].map(coord => [coord[1], coord[0]]));
                    } else if (data[0].geojson.type === "MultiPolygon") {
                        geojsonCoords.forEach(poly => { latlngs.push(poly[0].map(coord => [coord[1], coord[0]])); });
                    }
                    
                    var worldBounds = [[-90, -180], [90, -180], [90, 180], [-90, 180]];
                    var maskLayers = [worldBounds];
                    latlngs.forEach(hole => maskLayers.push(hole));
                    
                    L.polygon(maskLayers, { color: '#2980b9', weight: 3, fillOpacity: 1, fillColor: '#e5e5e5' }).addTo(map);
                }
            });

        var aktivniMarkeri = {};
        var globalnaMestaData = null;

        // FUNKCIJA KOJA ODLUČUJE ŠTA DA CRTA NA OSNOVU ZUMA
        function renderMap() {
            if (!globalnaMestaData) return;

            // Obriši sve prethodne markere sa mape
            for (let id in aktivniMarkeri) map.removeLayer(aktivniMarkeri[id]);
            aktivniMarkeri = {};

            let currentZoom = map.getZoom();
            // Granica: Ako je zoom manji od 15, prikazuj samo tačke (klastere)
            let isZoomedOut = currentZoom < 15;
            let isMobile = window.innerWidth <= 600;

            // Grupisanje mesta koja su na istim zgradama (udaljenost < ~200m)
            let grupe = [];
            const DISTANCE_THRESHOLD = 0.002; 

            Object.keys(globalnaMestaData).forEach(id => {
                let m = globalnaMestaData[id];
                let dodato = false;
                for (let g of grupe) {
                    let dx = g.lat - m.lat;
                    let dy = g.lng - m.lng;
                    if (Math.sqrt(dx*dx + dy*dy) < DISTANCE_THRESHOLD) {
                        g.mesta.push({...m, id: id});
                        dodato = true;
                        break;
                    }
                }
                if (!dodato) {
                    grupe.push({ lat: m.lat, lng: m.lng, mesta: [{...m, id: id}] });
                }
            });

            // CRTANJE GRUPA
            grupe.forEach((g, indexGroup) => {
                let count = g.mesta.length;

                if (isZoomedOut) {
                    // POGLED ODZUMIRANO (Samo tačke i brojevi)
                    let clusterHtml = '';
                    if (count > 1) {
                        clusterHtml = `<div class="cluster-dot" title="Biračkih mesta: ${count}">${count}</div>`;
                    } else {
                        clusterHtml = `<div class="single-dot" title="${g.mesta[0].naziv}"></div>`;
                    }

                    var pinIcon = L.divIcon({ className: 'custom-transparent-icon', html: clusterHtml, iconSize: [0, 0], iconAnchor: [0, 0] });
                    var marker = L.marker([g.lat, g.lng], { icon: pinIcon }).addTo(map);
                    
                    // Klik na tačku automatski zumira kameru da otvori detalje
                    marker.on('click', () => {
                        map.setView([g.lat, g.lng], 15, { animate: true });
                    });
                    
                    aktivniMarkeri['group_' + indexGroup] = marker;

                } else {
                    // POGLED ZUMIRANO (Eksplozija, pune table, isprekidane linije)
                    g.mesta.forEach((mesto, index) => {
                        let angle, distance;
                        let baseDistance = isMobile ? 50 : 80; // Na telefonu drži table bliže centru

                        if (count === 1) {
                            angle = -Math.PI / 2; // Ravno gore
                            distance = isMobile ? 40 : 60;
                        } else if (count === 2) {
                            angle = (index === 0) ? -Math.PI/4 : -3*Math.PI/4; // "V" oblik za 2 mesta
                            distance = baseDistance + 10;
                        } else {
                            angle = (index / count) * 2 * Math.PI - (Math.PI / 2); // Lepeza ukrug
                            distance = baseDistance + (count * 10);
                        }

                        let offsetX = Math.cos(angle) * distance;
                        let offsetY = Math.sin(angle) * distance;

                        let izlaznostHtml = '';
                        if(mesto.ukupan_broj && mesto.izaslo) {
                            let procenat = ((mesto.izaslo / mesto.ukupan_broj) * 100).toFixed(1);
                            let vremeTxt = mesto.vreme_update ? ` do ${mesto.vreme_update}h` : '';
                            izlaznostHtml = `<div class="live-turnout">👥 ${procenat}% ${vremeTxt}</div>`;
                        }

                        let pinHtml = `
                            <div style="position: relative; width: 0; height: 0; overflow: visible;">
                                
                                <svg style="position: absolute; top: -300px; left: -300px; width: 600px; height: 600px; z-index: 998; pointer-events: none;">
                                    <line x1="300" y1="300" x2="${300 + offsetX}" y2="${300 + offsetY}" stroke="#3498db" stroke-width="2.5" stroke-dasharray="5,5"/>
                                    <circle cx="${300 + offsetX}" cy="${300 + offsetY}" r="3" fill="#3498db" />
                                </svg>

                                <div style="position: absolute; top: 0; left: 0; width: 12px; height: 12px; background: #e74c3c; border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 999; box-shadow: 0 0 10px rgba(231, 76, 60, 0.8);"></div>

                                <div class="map-board" style="position: absolute; top: ${offsetY}px; left: ${offsetX}px; transform: translate(-50%, -50%); z-index: 1000; filter: drop-shadow(0 8px 15px rgba(0,0,0,0.25));">
                                    ${izlaznostHtml}
                                    <span class="board-title">${mesto.naziv}</span>
                                    <span class="board-number">BR: ${mesto.broj}</span>
                                </div>
                            </div>
                        `;

                        var pinIcon = L.divIcon({ className: 'custom-transparent-icon', html: pinHtml, iconSize: [0, 0], iconAnchor: [0, 0] });
                        var marker = L.marker([mesto.lat, mesto.lng], { icon: pinIcon }).addTo(map);
                        aktivniMarkeri[mesto.id] = marker;
                    });
                }
            });
        }

        // Pratimo izmene iz baze
        onValue(mestaRef, (snapshot) => {
            globalnaMestaData = snapshot.val();
            renderMap();
        });

        // Pratimo kada korisnik zumira in/out da bismo osvežili izgled
        map.on('zoomend', renderMap);
        
        // Opciono: osveži pri rotaciji telefona
        window.addEventListener('resize', renderMap);

    </script>
</body>
</html>
