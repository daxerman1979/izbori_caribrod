<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrovgrad - Biračka Mesta</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #1a1a1a;
        }

        /* Profi tabla sa trouglićem na dnu */
        .map-pin-container {
            position: relative;
            transform: translate(-50%, -100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            white-space: nowrap;
        }

        .map-board {
            background: #ffffff;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            padding: 6px 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .board-title {
            font-size: 13px;
            font-weight: 700;
            color: #2c3e50;
        }

        .board-number {
            font-size: 11px;
            color: #e74c3c;
            font-weight: 600;
        }

        /* Mali trouglić (strellica) nadole ispod table */
        .map-triangle {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #2c3e50;
            margin-top: -1px;
        }

        /* Staklasti prozor za unos (popup) */
        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.85) !important;
            backdrop-filter: blur(12px);
            color: white !important;
            border-radius: 14px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px !important;
        }

        .leaflet-popup-tip {
            background: rgba(20, 20, 20, 0.85) !important;
        }

        .profi-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 210px;
            padding: 8px;
        }

        .profi-form h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .profi-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 9px 12px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .profi-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .profi-input:focus {
            border-color: #3498db;
            background: rgba(255, 255, 255, 0.12);
        }

        .profi-submit-btn {
            background: linear-gradient(135deg, #2ed573, #26af5f);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        .profi-submit-btn:hover {
            opacity: 0.9;
        }

        .profi-submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        // Inicijalizacija mape centrirane na Dimitrovgrad
        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 14);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> saradnici'
        }).addTo(map);

        var aktivniMarkeri = {};

        onValue(mestaRef, (snapshot) => {
            for (let id in aktivniMarkeri) {
                map.removeLayer(aktivniMarkeri[id]);
            }
            aktivniMarkeri = {};

            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                let mesto = data[id];

                // Kreiranje table sa nazivom gore, brojem ispod i trouglićem na dnu
                var pinHtml = `
                    <div class="map-pin-container">
                        <div class="map-board">
                            <span class="board-title">${mesto.naziv}</span>
                            <span class="board-number">Broj: ${mesto.broj}</span>
                        </div>
                        <div class="map-triangle"></div>
                    </div>
                `;

                var pinIcon = L.divIcon({
                    className: 'custom-pin-icon',
                    html: pinHtml,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });

                var marker = L.marker([mesto.lat, mesto.lng], { icon: pinIcon }).addTo(map);
                aktivniMarkeri[id] = marker;
            });
        });

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            var formHtml = `
                <div class="profi-form">
                    <h4>Novo Biračko Mesto</h4>
                    <input type="text" id="input-naziv" class="profi-input" placeholder="Naziv (npr. Dom kulture)">
                    <input type="text" id="input-broj" class="profi-input" placeholder="Broj (npr. 05)">
                    <button id="save-btn" class="profi-submit-btn">Sačuvaj na mapu</button>
                </div>
            `;

            L.popup()
                .setLatLng([lat, lng])
                .setContent(formHtml)
                .openOn(map);

            setTimeout(() => {
                var saveBtn = document.getElementById('save-btn');
                if (saveBtn) {
                    saveBtn.onclick = function() {
                        var naziv = document.getElementById('input-naziv').value.trim();
                        var broj = document.getElementById('input-broj').value.trim();

                        if (!naziv || !broj) {
                            alert("Molimo popunite oba polja (naziv i broj)!");
                            return;
                        }

                        const novoMestoRef = push(mestaRef);
                        set(novoMestoRef, {
                            lat: lat,
                            lng: lng,
                            naziv: naziv,
                            broj: broj
                        }).then(() => {
                            map.closePopup();
                        }).catch((error) => {
                            alert("Greška pri upisu u bazu: " + error.message);
                        });
                    };
                }
            }, 100);
        });
    </script>

</body>
</html>
