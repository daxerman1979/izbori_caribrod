<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biračka mesta - Dimitrovgrad</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        /* Minimalno zaglavlje preko mape */
        header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            text-align: center;
        }

        /* Mapa zauzima ceo ekran */
        #map {
            width: 100%;
            height: 100vh;
        }

        /* Atraktivan GUI element (kartica) direktno na mapi */
        .map-card-marker {
            background: white;
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #e74c3c;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            position: relative;
        }

        .map-card-marker::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px 6px 0;
            border-style: solid;
            border-color: white transparent;
            display: block;
            width: 0;
        }

        .badge-number {
            background: #e74c3c;
            color: white;
            font-weight: bold;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .badge-info {
            display: flex;
            flex-direction: column;
        }

        .badge-title {
            font-weight: bold;
            font-size: 13px;
            color: #2c3e50;
        }

        .btn-delete-badge {
            background: #e74c3c;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
            transition: background 0.2s;
        }

        .btn-delete-badge:hover {
            background: #c0392b;
        }

        /* Forma za unos pri kliku na mapu */
        .popup-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 180px;
        }

        .popup-form input {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .popup-form button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .popup-form button:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <header>
        <h1>Dimitrovgrad - Biračka Mesta</h1>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        // Inicijalizacija mape centrirane na Dimitrovgrad
        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 14);

        // Dodavanje dugmadi za zumiranje u ugao da ne smetaju
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> saradnici'
        }).addTo(map);

        var aktivniMarkeri = {};

        // Praćenje baza podataka u realnom vremenu
        onValue(mestaRef, (snapshot) => {
            // Uklanjanje starih elemenata sa mape
            for (let id in aktivniMarkeri) {
                map.removeLayer(aktivniMarkeri[id]);
            }
            aktivniMarkeri = {};

            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                let mesto = data[id];

                // Kreiranje modernog vizuelnog GUI elementa direktno na mapi
                var customHtml = `
                    <div class="map-card-marker">
                        <span class="badge-number">#${mesto.broj}</span>
                        <div class="badge-info">
                            <span class="badge-title">${mesto.naziv}</span>
                        </div>
                        <button class="btn-delete-badge" onclick="obrisiMesto('${id}', event)" title="Obriši">×</button>
                    </div>
                `;

                var customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: customHtml,
                    iconSize: [0, 0], // Pozicionira se preko CSS transform-a
                    iconAnchor: [0, 0]
                });

                var marker = L.marker([mesto.lat, mesto.lng], { icon: customIcon }).addTo(map);
                aktivniMarkeri[id] = marker;
            });
        });

        // Klik na mapu otvara formu za dodavanje novog mesta
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            var formHtml = `
                <div class="popup-form">
                    <strong>Novo biračko mesto</strong>
                    <input type="text" id="input-broj" placeholder="Broj (npr. 12)">
                    <input type="text" id="input-naziv" placeholder="Naziv (Dom kulture)">
                    <button id="save-btn">Sačuvaj na mapu</button>
                </div>
            `;

            L.popup()
                .setLatLng([lat, lng])
                .setContent(formHtml)
                .openOn(map);

            setTimeout(() => {
                var saveBtn = document.getElementById('save-btn');
                if (saveBtn) {
                    saveBtn.onclick = function() {
                        var broj = document.getElementById('input-broj').value;
                        var naziv = document.getElementById('input-naziv').value;

                        if (!broj || !naziv) {
                            alert("Molimo unesite i broj i naziv biračkog mesta!");
                            return;
                        }

                        const novoMestoRef = push(mestaRef);
                        set(novoMestoRef, {
                            lat: lat,
                            lng: lng,
                            broj: broj,
                            naziv: naziv
                        }).then(() => {
                            map.closePopup();
                        }).catch((error) => {
                            alert("Greška pri čuvanju: " + error.message);
                        });
                    };
                }
            }, 100);
        });

        // Funkcija za brisanje direktno sa markera na mapi
        window.obrisiMesto = function(id, event) {
            event.stopPropagation();
            if (confirm("Da li ste sigurni da želite da obrišete ovo biračko mesto?")) {
                remove(ref(db, 'biracka_mesta/' + id)).catch((error) => {
                    alert("Greška pri brisanju: " + error.message);
                });
            }
        };
    </script>

</body>
</html>
