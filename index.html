<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrovgrad - Biračka Mesta</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, sans-serif; overflow: hidden; background: #e5e5e5; }
        #map { width: 100%; height: 100vh; background: #1e293b; } /* Tamnija pozadina van granica */
        
        .custom-transparent-icon { background: transparent !important; border: none !important; width: 0 !important; height: 0 !important; margin: 0 !important; padding: 0 !important; overflow: visible !important; }
        .map-pin-container { position: absolute; top: 0; left: 0; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.25)); z-index: 1000; }
        
        .map-board { background: #ffffff; border-radius: 8px; padding: 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 90px; max-width: 220px; position: relative; }
        .live-turnout { background: linear-gradient(135deg, #f39c12, #e67e22); color: white; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 12px; margin-bottom: 4px; box-shadow: 0 2px 8px rgba(243, 156, 18, 0.5); white-space: nowrap; }
        
        .board-title { font-size: 13px; font-weight: 800; color: #1e293b; text-align: center; line-height: 1.2; text-transform: uppercase; }
        .board-number { font-size: 11px; color: #ef4444; font-weight: 700; background: #fee2e2; padding: 2px 10px; border-radius: 12px; text-transform: uppercase; }
        .map-triangle { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid #ffffff; margin-top: -1px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 12);
        L.control.zoom({ position: 'topleft' }).addTo(map);
        
        // Svetla mapa
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // ZATAMNJIVANJE TERITORIJE VAN OPŠTINE
        fetch('https://nominatim.openstreetmap.org/search?q=Op%C5%A1tina+Dimitrovgrad,+Serbia&format=json&polygon_geojson=1&limit=1')
            .then(response => response.json())
            .then(data => {
                if(data.length > 0 && data[0].geojson) {
                    var geojsonCoords = data[0].geojson.coordinates;
                    if(data[0].geojson.type === "Polygon") geojsonCoords = [geojsonCoords];
                    
                    var latlngs = geojsonCoords.map(poly => poly[0].map(coord => [coord[1], coord[0]]));
                    var worldBounds = [[-90, -180], [90, -180], [90, 180], [-90, 180]];
                    
                    // Crtanje maske (crna polutransparentna pozadina sa "rupom" u obliku Dimitrovgrada)
                    L.polygon([worldBounds, ...latlngs], {
                        color: '#1e293b', weight: 2, fillOpacity: 0.7, fillColor: '#0f172a'
                    }).addTo(map);
                }
            });

        var aktivniMarkeri = {};

        onValue(mestaRef, (snapshot) => {
            for (let id in aktivniMarkeri) map.removeLayer(aktivniMarkeri[id]);
            aktivniMarkeri = {};
            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                let mesto = data[id];
                
                let izlaznostHtml = '';
                if(mesto.ukupan_broj && mesto.izaslo) {
                    let procenat = ((mesto.izaslo / mesto.ukupan_broj) * 100).toFixed(1);
                    let vremeTxt = mesto.vreme_update ? ` do ${mesto.vreme_update}h` : '';
                    izlaznostHtml = `<div class="live-turnout">👥 ${procenat}% ${vremeTxt}</div>`;
                }

                var pinHtml = `
                    <div class="map-pin-container">
                        <div class="map-board">
                            ${izlaznostHtml}
                            <span class="board-title">${mesto.naziv}</span>
                            <span class="board-number">BR: ${mesto.broj}</span>
                        </div>
                        <div class="map-triangle"></div>
                    </div>`;

                var pinIcon = L.divIcon({ className: 'custom-transparent-icon', html: pinHtml, iconSize: [0, 0], iconAnchor: [0, 0] });
                
                // Samo kreiramo marker, bez ikakvih funkcija klika
                var marker = L.marker([mesto.lat, mesto.lng], { icon: pinIcon }).addTo(map);
                aktivniMarkeri[id] = marker;
            });
        });
    </script>
</body>
</html>
