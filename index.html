<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrovgrad - Biračka Mesta</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            background: #e5e5e5;
        }

        .custom-transparent-icon {
            background: transparent !important;
            border: none !important;
        }

        .map-pin-container {
            position: absolute;
            bottom: 0;
            left: 0;
            transform: translate(-50%, -100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.25));
            z-index: 1000;
            cursor: pointer;
        }

        .map-pin-container:hover .map-board {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .map-board {
            background: #ffffff;
            border-radius: 6px;
            padding: 8px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 80px;
            max-width: 220px;
            transition: all 0.2s ease;
        }

        .board-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            white-space: normal;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .board-number {
            font-size: 11px;
            color: #ef4444;
            font-weight: 700;
            background: #fee2e2;
            padding: 2px 10px;
            border-radius: 12px;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .map-triangle {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid #ffffff;
            margin-top: -1px;
        }

        /* 1. Uklonjen pokazivač (strelica) sa staklastog popupa */
        .leaflet-popup-tip-container {
            display: none !important;
        }
        
        .leaflet-popup {
            margin-bottom: 25px !important; /* Blago odvajanje od same bele table ispod */
        }

        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.85) !important;
            backdrop-filter: blur(12px);
            color: white !important;
            border-radius: 14px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px !important;
        }

        .profi-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 230px;
            padding: 8px;
        }

        .profi-form h4 {
            margin: 0 0 5px 0;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
            text-align: center;
        }

        /* 2. Stilovi za "dva odvojena dela" table */
        .board-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .board-section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #3498db;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .profi-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            padding: 8px 10px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .profi-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .profi-input:focus {
            border-color: #3498db;
            background: rgba(255, 255, 255, 0.12);
        }

        textarea.profi-input {
            resize: vertical;
            min-height: 55px;
        }

        .profi-submit-btn {
            background: linear-gradient(135deg, #2ed573, #26af5f);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        .profi-submit-btn:hover {
            opacity: 0.9;
        }

        .profi-submit-btn:active {
            transform: scale(0.98);
        }

        #admin-badge {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #e74c3c;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
            display: none;
        }
    </style>
</head>
<body>

    <div id="admin-badge">ADMIN REŽIM AKTIVAN</div>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://daxgame-ad90a-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const mestaRef = ref(db, 'biracka_mesta');

        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'da';

        if (isAdmin) {
            document.getElementById('admin-badge').style.display = 'block';
        }

        var map = L.map('map', { zoomControl: false }).setView([43.0186, 22.7447], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> saradnici'
        }).addTo(map);

        var aktivniMarkeri = {};

        // 3. Automatsko gašenje posle 1 minuta (60000ms) neaktivnosti (samo za NE-admine)
        let tajmerNeaktivnosti;

        function resetujTajmer() {
            if (isAdmin) return; // Adminima se ne gasi tajmerom
            clearTimeout(tajmerNeaktivnosti);
            tajmerNeaktivnosti = setTimeout(() => {
                map.closePopup(); // Gasi prozor nakon minut
            }, 60000);
        }

        // Pratimo interakcije u otvorenom prozoru da osvežimo tajmer
        map.on('popupopen', function(e) {
            if (!isAdmin) {
                let popupEl = e.popup.getElement();
                if (popupEl) {
                    popupEl.addEventListener('mousemove', resetujTajmer);
                    popupEl.addEventListener('keypress', resetujTajmer);
                    popupEl.addEventListener('click', resetujTajmer);
                    popupEl.addEventListener('input', resetujTajmer);
                }
                resetujTajmer(); // Pokreni tajmer čim se otvori
            }
        });

        // Brisemo tajmer ako se prozor ručno zatvori
        map.on('popupclose', function() {
            clearTimeout(tajmerNeaktivnosti);
        });

        onValue(mestaRef, (snapshot) => {
            for (let id in aktivniMarkeri) {
                map.removeLayer(aktivniMarkeri[id]);
            }
            aktivniMarkeri = {};

            const data = snapshot.val();
            if (!data) return;

            Object.keys(data).forEach((id) => {
                let mesto = data[id];

                var pinHtml = `
                    <div class="map-pin-container">
                        <div class="map-board">
                            <span class="board-title">${mesto.naziv}</span>
                            <span class="board-number">Broj: ${mesto.broj}</span>
                        </div>
                        <div class="map-triangle"></div>
                    </div>
                `;

                var pinIcon = L.divIcon({
                    className: 'custom-transparent-icon',
                    html: pinHtml,
                    iconSize: [0, 0],
                    iconAnchor: [0, 0]
                });

                var marker = L.marker([mesto.lat, mesto.lng], { icon: pinIcon }).addTo(map);
                
                marker.on('click', function(e) {
                    L.DomEvent.stopPropagation(e); 

                    let popupContent = `
                        <div class="profi-form" id="popup-content-${id}">
                            <h4>Zaštićen pristup</h4>
                            <input type="password" id="pin-input-${id}" class="profi-input" placeholder="Unesite 6-cifreni kod..." maxlength="6">
                            <button class="profi-submit-btn" onclick="proveriPin('${id}')">Otključaj Tablu</button>
                        </div>
                    `;

                    L.popup()
                        .setLatLng(marker.getLatLng())
                        .setContent(popupContent)
                        .openOn(map);
                });

                aktivniMarkeri[id] = marker;
            });
        });

        window.proveriPin = function(id) {
            let uneseniPin = document.getElementById(`pin-input-${id}`).value;
            
            if (uneseniPin === '123456') {
                // Generisanje table podeljene na tačno DVA DELA
                let noviSadrzaj = `
                    <div class="profi-form">
                        <h4>Ažuriranje Podataka</h4>
                        
                        <div class="board-section">
                            <p class="board-section-title">Deo 1: Izlaznost</p>
                            <input type="text" id="izlaznost-${id}" class="profi-input" placeholder="Npr. 45.5%">
                        </div>
                        
                        <div class="board-section">
                            <p class="board-section-title">Deo 2: Rezultati</p>
                            <textarea id="rezultati-${id}" class="profi-input" placeholder="Unesite raspored glasova..."></textarea>
                        </div>
                        
                        <button class="profi-submit-btn" onclick="potvrdiPodatke('${id}')">Snimi i Potvrdi</button>
                    </div>
                `;
                document.getElementById(`popup-content-${id}`).innerHTML = noviSadrzaj;
                resetujTajmer(); // Restart tajmera nakon što uspešno otključa
            } else {
                alert("Netačan kod! Pokušajte ponovo.");
            }
        };

        window.potvrdiPodatke = function(id) {
            let izlaznost = document.getElementById(`izlaznost-${id}`).value;
            let rezultati = document.getElementById(`rezultati-${id}`).value;
            alert(`Spremno za slanje u bazu!\n\nIzlaznost: ${izlaznost}\nRezultati: ${rezultati}`);
            map.closePopup(); // Gasi popup nakon čuvanja
        };

        // ADMIN KREIRANJE NOVIH MESTA
        if (isAdmin) {
            map.on('click', function(e) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;

                var formHtml = `
                    <div class="profi-form">
                        <h4>Novo Biračko Mesto</h4>
                        <input type="text" id="input-naziv" class="profi-input" placeholder="Naziv (npr. Dom kulture)">
                        <input type="text" id="input-broj" class="profi-input" placeholder="Broj (npr. 05)">
                        <button id="save-btn" class="profi-submit-btn">Postavi tablu na mapu</button>
                    </div>
                `;

                L.popup()
                    .setLatLng([lat, lng])
                    .setContent(formHtml)
                    .openOn(map);

                setTimeout(() => {
                    var saveBtn = document.getElementById('save-btn');
                    if (saveBtn) {
                        saveBtn.onclick = function() {
                            var naziv = document.getElementById('input-naziv').value.trim();
                            var broj = document.getElementById('input-broj').value.trim();

                            if (!naziv || !broj) {
                                alert("Molimo popunite oba polja (naziv i broj)!");
                                return;
                            }

                            const novoMestoRef = push(mestaRef);
                            set(novoMestoRef, {
                                lat: lat,
                                lng: lng,
                                naziv: naziv,
                                broj: broj
                            }).then(() => {
                                map.closePopup();
                            }).catch((error) => {
                                alert("Greška pri upisu u bazu: " + error.message);
                            });
                        };
                    }
                }, 100);
            });
        }
    </script>

</body>
</html>
